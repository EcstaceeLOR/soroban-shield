name: Release

# Runs only when a version tag is pushed. Nothing is published by merging to main.
# Status: this workflow has not been run against a real tag yet.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: v
        name: Tag must match the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="sorobanshield"))')"
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match crate version $crate" >&2
            exit 1
          fi
          grep -q "^## $tag\b" CHANGELOG.md || { echo "CHANGELOG.md has no '## $tag' section" >&2; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: sorobanshield
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: sorobanshield
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: sorobanshield.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p sorobanshield --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: scripts/package-release.sh "${{ needs.verify.outputs.version }}" "${{ matrix.target }}" "target/${{ matrix.target }}/release/${{ matrix.bin }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SorobanShield ${GITHUB_REF_NAME#v}" \
            --notes "Draft created from tag $GITHUB_REF_NAME. Review the changelog entry and the checksums, then publish." \
            --draft
